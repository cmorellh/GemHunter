; CSVs in data/ as DataTables. Left blank on purpose: pointing them at assets
; that do not exist yet would log a load failure on every editor start.
; Expected paths once imported:
;   GemTable=/Game/GemHunter/Data/DT_Gems.DT_Gems
;   LocalityTable=/Game/GemHunter/Data/DT_Localities.DT_Localities
;   RockLayerTable=/Game/GemHunter/Data/DT_RockLayers.DT_RockLayers
;   ToolTierTable=/Game/GemHunter/Data/DT_ToolTiers.DT_ToolTiers
;   MissionTable=/Game/GemHunter/Data/DT_Missions.DT_Missions
